<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공필</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">LOCAL-FIRST WRITING WORKSPACE</p>
        <h1>공필</h1>
      </div>
      <div class="header-actions">
        <span id="networkStatus" class="status-pill" data-state="starting">시작 중</span>
        <button id="usageButton" class="ghost-button" type="button">AI 사용 정보</button>
        <button id="logsButton" class="ghost-button" type="button">개발 로그</button>
        <button id="shutdownButton" class="ghost-button" type="button">공필 종료</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel projects-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">PROJECTS</p>
            <h2>프로젝트</h2>
          </div>
        </div>
        <form id="projectForm" class="compact-form">
          <label for="projectName">새 프로젝트 이름</label>
          <div class="form-row">
            <input id="projectName" name="projectName" maxlength="100" placeholder="예: 장편 소설" required>
            <button type="submit">만들기</button>
          </div>
        </form>
        <div id="projectList" class="item-list" aria-live="polite"></div>
      </aside>

      <aside class="panel documents-panel">
        <div class="panel-heading">
          <div>
            <p class="section-label">DOCUMENTS</p>
            <h2 id="documentPanelTitle">문서</h2>
          </div>
        </div>
        <form id="documentForm" class="compact-form" hidden>
          <label for="documentPath">새 문서 경로</label>
          <div class="form-row">
            <input id="documentPath" name="documentPath" placeholder="notes/idea.md" required>
            <button type="submit">추가</button>
          </div>
        </form>
        <div id="documentList" class="item-list empty-state">프로젝트를 선택하세요.</div>
      </aside>

      <section class="panel editor-panel">
        <div class="editor-toolbar">
          <div>
            <p id="editorProject" class="section-label">EDITOR</p>
            <h2 id="editorTitle">문서를 선택하세요</h2>
            <p id="editorMeta" class="editor-meta">저장할 문서를 선택하면 편집기가 열립니다.</p>
          </div>
          <button id="saveButton" type="button" disabled>변경 저장</button>
        </div>
        <textarea id="editor" spellcheck="true" disabled aria-label="문서 편집기"></textarea>
        <div class="editor-footer">
          <span id="saveStatus">대기 중</span>
          <span id="characterCount">0자</span>
        </div>
      </section>

      <aside class="panel chat-panel">
        <div class="panel-heading chat-heading">
          <div>
            <p class="section-label">CO-WRITER</p>
            <h2>공동 집필</h2>
          </div>
          <span id="aiStatus" class="ai-status">설정 확인 중</span>
        </div>
        <section class="context-selector" aria-label="AI 컨텍스트 선택">
          <div class="context-selector-heading">
            <strong>문서·청크 지정</strong>
            <span id="contextSelectionSummary">선택 0개</span>
          </div>
          <form id="chunkSearchForm" class="context-search-form">
            <input id="chunkSearchInput" maxlength="500" placeholder="프로젝트 청크 검색" aria-label="청크 검색어">
            <button type="submit">검색</button>
          </form>
          <div class="context-actions">
            <button id="selectVisibleChunksButton" class="ghost-button" type="button">보이는 청크 선택</button>
            <button id="clearChunkSelectionButton" class="ghost-button" type="button">선택 해제</button>
          </div>
          <div id="chunkList" class="chunk-list empty-state">문서를 선택하면 청크가 표시됩니다.</div>
        </section>
        <div id="chatMessages" class="chat-messages empty-state" aria-live="polite">
          프로젝트를 선택하면 AI와 함께 작성할 수 있습니다.
        </div>
        <form id="chatForm" class="chat-form">
          <label for="chatInput">요청</label>
          <textarea id="chatInput" maxlength="20000" placeholder="예: 이 장면의 긴장감을 높이는 수정안을 만들어줘" disabled></textarea>
          <button id="chatSendButton" type="submit" disabled>AI에게 보내기</button>
        </form>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="observabilityDialog" class="observability-dialog">
      <div class="dialog-heading">
        <div>
          <p id="dialogEyebrow" class="section-label">AI</p>
          <h2 id="dialogTitle">사용 정보</h2>
        </div>
        <button id="dialogCloseButton" class="ghost-button" type="button">닫기</button>
      </div>
      <div id="dialogContent" class="dialog-content"></div>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
